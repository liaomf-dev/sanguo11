// columns: [label, index, type, groupStart]
const COLS = [
  ['序號',0,'num'],['姓名',2,'name'],['相性',1,'num'],
  ['統率',3,'stat',1],['武力',4,'stat'],['智力',5,'stat'],['政治',6,'stat'],['魅力',7,'stat'],['綜合',8,'total'],
  ['特技',9,'skill',1],
  ['槍',10,'g',1],['戟',11,'g'],['弩',12,'g'],['騎',13,'g'],['兵',14,'g'],['水',15,'g']
];
const GR = {S:4,A:3,B:2,C:1};
let sortCol = 8, dir = -1;

const $ = id => document.getElementById(id);
const head = $('head'), body = $('body');

// skill options sorted by frequency
const freq = {};
DATA.forEach(r => { if (r[9]) freq[r[9]] = (freq[r[9]]||0)+1; });
Object.keys(freq).sort((a,b)=>freq[b]-freq[a]||a.localeCompare(b,'zh-Hant')).forEach(s=>{
  const o=document.createElement('option'); o.value=s; o.textContent=`${s}（${freq[s]}）`; $('skill').appendChild(o);
});

COLS.forEach((c,ci)=>{
  const th=document.createElement('th');
  th.tabIndex=0;
  th.className=(c[2]==='name'?'name ':'')+(c[3]?'grp':'');
  th.innerHTML=`${c[0]}<span class="arr"></span>`;
  th.onclick=()=>setSort(ci);
  th.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();setSort(ci);}};
  head.appendChild(th);
});

function setSort(ci){
  if (sortCol===COLS[ci][1]) dir=-dir;
  else { sortCol=COLS[ci][1]; dir = (COLS[ci][2]==='name'||COLS[ci][2]==='skill'||COLS[ci][2]==='num') ? 1 : -1; }
  render();
}

function key(r,i){
  const v=r[i];
  if (i>=10) return GR[v]||0;
  return v;
}

function render(){
  const q=$('q').value.trim(), sk=$('skill').value, ap=$('apt').value;
  let rows=DATA.filter(r=>(!q||r[2].includes(q)||r[9].includes(q))&&(!sk||r[9]===sk)&&(!ap||r[+ap]==='S'));
  rows.sort((a,b)=>{
    let x=key(a,sortCol), y=key(b,sortCol), d;
    if (typeof x==='string') {
      if (!x && y) return 1; if (x && !y) return -1;
      d=x.localeCompare(y,'zh-Hant');
    } else d=x-y;
    return d*dir || (b[8]-a[8]);
  });
  [...head.children].forEach((th,ci)=>{
    const on=COLS[ci][1]===sortCol;
    th.classList.toggle('on',on);
    th.querySelector('.arr').textContent=on?(dir<0?'▼':'▲'):'';
    th.setAttribute('aria-sort',on?(dir<0?'descending':'ascending'):'none');
  });
  $('shown').textContent=rows.length;
  if(!rows.length){body.innerHTML=`<tr><td class="empty" colspan="${COLS.length}">沒有符合條件的武將，試試其他關鍵字或按「重設」。</td></tr>`;return;}
  body.innerHTML=rows.map(r=>'<tr>'+COLS.map(c=>{
    const v=r[c[1]], g=c[3]?' grp':'';
    switch(c[2]){
      case 'name': return `<td class="name">${v}</td>`;
      case 'num': return `<td class="num">${v}</td>`;
      case 'stat': return `<td class="stat${v>=90?' hi':''}${g}"><i style="width:calc((100% - 8px)*${v/100})"></i><span>${v}</span></td>`;
      case 'total': return `<td class="total">${v}</td>`;
      case 'skill': return `<td class="skill${v?'':' none'}${g}">${v||'—'}</td>`;
      case 'g': return `<td class="${g.trim()}"><span class="g g${v}">${v}</span></td>`;
    }
  }).join('')+'</tr>').join('');
}

let t; $('q').addEventListener('input',()=>{clearTimeout(t);t=setTimeout(render,120);});
$('skill').onchange=render; $('apt').onchange=render;
$('reset').onclick=()=>{$('q').value='';$('skill').value='';$('apt').value='';sortCol=8;dir=-1;render();};
render();
</script>
